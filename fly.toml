app = "master-bot"
primary_region = "iad"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    port = 3000
    type = "http"
    path = "/health"
    interval = "30s"
    timeout = "5s"

[mounts]
  source = "master_bot_data"
  destination = "/Master-Bot/packages/db/prisma"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
