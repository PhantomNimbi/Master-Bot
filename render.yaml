services:
  - type: web
    name: master-bot
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: LAVA_ENABLED
        value: "false"
      - key: LAVA_EXTERNAL
        value: "true"
      - key: DATABASE_URL
        value: "file:./db.sqlite"
      - key: INTERNAL_URL
        value: "http://localhost:10000"
      - key: PUBLIC_URL
        sync: false
      - key: DISCORD_CALLBACK_URL
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
