name: Bug Report
description: Create a report to help us improve Master-Bot
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        ### Instructions
        Please provide detailed information to help reproduce and fix the bug.

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Use command `/...`
        2. Pass argument `...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux (Ubuntu/Debian)
        - macOS
        - Docker
        - Other
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      placeholder: "e.g., v20.11.0"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context / Logs
      description: Add any error logs, stack traces, or screenshots here.
    validations:
      required: false
