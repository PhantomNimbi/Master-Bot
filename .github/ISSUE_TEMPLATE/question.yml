name: Question
description: Ask a question about setting up or using Master-Bot
title: '[Question]: '
labels: ['question']
body:
  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Relevant Context
      description: Anything that helps us answer (OS, setup method, error, etc.).
    validations:
      required: false
