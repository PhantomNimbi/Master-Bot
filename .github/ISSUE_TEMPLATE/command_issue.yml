name: Command Issue
description: Report a problem with a specific slash command
title: '[Command]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        ### Instructions
        Describe the command that is not working as expected and what should happen instead.

  - type: input
    id: command
    attributes:
      label: Command
      description: The slash command that has an issue.
      placeholder: "/play"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Issue
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `/...`
        2. Pass arguments `...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Output / Logs
      description: Paste any Discord error message or bot log output.
    validations:
      required: false
