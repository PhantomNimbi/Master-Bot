name: Music / Audio Bug
description: Report a music or audio playback issue (Lavalink, YouTube, Spotify, SoundCloud, Twitch, etc.)
title: '[Music]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        ### Instructions
        Please provide detailed information so we can diagnose the audio playback issue.

  - type: textarea
    id: description
    attributes:
      label: Describe the Issue
      description: What happened during playback? Include the command used and the track or source involved.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `/play ...`
        2. Join a voice channel
        3. Observe the failure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Track Source
      options:
        - YouTube
        - Spotify
        - SoundCloud
        - Twitch
        - Direct URL / File
        - Other / Unknown
    validations:
      required: false

  - type: input
    id: lavalink-version
    attributes:
      label: Lavalink Version
      description: Version of Lavalink in use (see `application.yml`).
      placeholder: "e.g., v4.x"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Lavalink / Bot Logs
      description: Paste any relevant log output (e.g. `logs/lavalink.log`, `logs/bot.log`), including error codes and stack traces.
    validations:
      required: false
