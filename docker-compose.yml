version: '3.8'
services:
  master-bot:
    container_name: master-bot
    platform: 'linux/amd64'
    env_file:
      - .env
    environment:
      # Bot, dashboard and OAuth2 callback server share ONE port
      PORT: 3000
      DISCORD_DB_PATH: /app/data/bot.sqlite
      LAVA_HOST: lavalink
      LAVA_PORT: 2333
    restart: always
    build: .
    ports:
      - '3000:3000' # Unified Master-Bot (bot + embedded dashboard + OAuth2)
    command: pnpm start
    depends_on:
      lavalink:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
  lavalink:
    container_name: master-bot-lavalink
    restart: always
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    ports:
      - '2333:2333'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:2333/version']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml