version: '3'
services:
  master-bot:
    platform: 'linux/amd64'
    env_file:
      - docker.env
    restart: always
    build: .
    ports:
      - '3000:3000' # Dashboard
      # - "5555:5555" # Prisma Studio Port  - uncomment to open
    command: >
      sh -c "pnpm run db:push && pnpm run -r start"
    depends_on:
      lavalink:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: ${REDIS_HOST} # Must match service name
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
    links:
      - lavalink
      - redis
    volumes:
      - ./logs:/Master-Bot/logs
      - sqlite-data:/Master-Bot/packages/db/prisma
  lavalink:
    restart: always
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    healthcheck:
      test: 'echo lavalink'
      interval: 10s
      timeout: 10s
      retries: 3
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
  redis:
    env_file:
      - docker.env
    image: redis:7-alpine
    restart: always
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
    command: redis-server --save 20 1 --loglevel warning
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 10s
      retries: 3
    volumes:
      - redis:/data
volumes:
  sqlite-data:
    driver: local
  redis:
    driver: local